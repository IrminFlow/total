name: Reliability soak

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Company-switch/import/backup/report cycles
        required: false
        default: "60"
  schedule:
    - cron: "43 2 * * 0"

permissions:
  contents: read

jobs:
  soak-mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Repeat company switches, imports, reports, backups and restores
        run: npm run test:soak
        env:
          TOTAL_SOAK_ITERATIONS: ${{ inputs.iterations || '60' }}
          TOTAL_DATA_DIR: ${{ runner.temp }}/total-soak-data
          SMOKE_OUT: ${{ runner.temp }}/total-soak-evidence

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: total-soak-evidence
          path: ${{ runner.temp }}/total-soak-evidence
          if-no-files-found: error

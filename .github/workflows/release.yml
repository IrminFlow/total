# Build the macOS + Windows apps and publish them to GitHub Releases for one version tag.
# Two ways in:
#   - a v* tag pushed by hand (npm version patch && git push --follow-tags) — the push trigger;
#   - the scheduled release (scheduled-release.yml) CALLS this workflow with `tag`, because a tag
#     pushed with GITHUB_TOKEN never triggers other workflows.
# electron-updater in the app reads these releases to auto-update installed copies.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: The v* tag to build and publish (already pushed)
        required: true
        type: string
  # Re-run a release whose build failed after its tag was pushed (Actions → Release → Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: The v* tag to build and publish (already pushed)
        required: true
        type: string

env:
  # The tag being released: the caller's input, else the pushed tag.
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: DB-layer tests (Electron-as-Node)
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Hermetic IPC smoke test against the build
        run: npm run smoke
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}/total-data
          SMOKE_OUT: ${{ runner.temp }}/smoke

      - name: Ensure the release exists (one per tag)
        # electron-builder's parallel asset uploads race to CREATE the release and can end up
        # with two releases on one tag (observed on v0.3.0) — pre-creating makes it only upload.
        # Created as a DRAFT and published only after the Windows files are up (last step of
        # release-win), so /releases/latest never points at a release without its assets.
        # Notes = the version's CHANGELOG section when the tree has the script (scheduled releases).
        run: |
          if [ -f scripts/release/gate.mjs ]; then node scripts/release/gate.mjs notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"; else echo "Release notes to follow." > "$RUNNER_TEMP/notes.md"; fi
          gh release create "$TAG" --draft --title "Total ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish DMG + ZIP to the release
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned beta builds: users right-click → Open on first launch, and the
          # in-app updater falls back to a "download the new version" prompt.
          # When you have an Apple Developer ID, add CSC_LINK + CSC_KEY_PASSWORD
          # secrets here and auto-update becomes fully silent.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  release-win:
    # Runs after the mac job so both publish into the SAME release —
    # parallel jobs each create their own release for the tag (learned the hard way).
    needs: release-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: DB-layer tests (Electron-as-Node)
        run: npm run test:db

      - name: Build NSIS installer (no publish — electron-builder creates a DUPLICATE
          release for the tag even when one exists; observed on v0.2.0)
        run: npm run build && npx electron-builder --win --publish never

      # WP 7.3: electron-updater downloads the file latest.yml names, so the uploaded asset must
      # carry exactly that name (0.11.0 shipped "Total Setup 0.11.0.exe" — GitHub stored it as
      # Total.Setup.0.11.0.exe while latest.yml asked for Total-Setup-0.11.0.exe).
      - name: latest.yml names the installer exactly
        shell: bash
        run: |
          exe=$(cd dist && ls *.exe | head -1)
          case "$exe" in *" "*) echo "installer name has a space: $exe"; exit 1;; esac
          grep -q "^path: $exe$" dist/latest.yml || { echo "latest.yml does not name $exe"; cat dist/latest.yml; exit 1; }

      - name: Hermetic IPC smoke test against the packaged Total.exe
        run: npm run smoke
        env:
          TOTAL_APP_EXECUTABLE: ${{ github.workspace }}\dist\win-unpacked\Total.exe
          TOTAL_DATA_DIR: ${{ runner.temp }}\Total packaged data
          SMOKE_OUT: ${{ runner.temp }}\smoke-packaged

      - name: Upload installer to the existing release
        shell: bash
        run: |
          gh release upload "${TAG}" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release (never left as a draft)
        shell: bash
        run: gh release edit "${TAG}" --draft=false --latest --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Build the macOS app and publish it to GitHub Releases whenever a version tag is pushed.
# Tag with:  npm version patch && git push --follow-tags
# electron-updater in the app reads these releases to auto-update installed copies.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability gate (roadmap #270). Runtime dependencies only, and only high
      # and critical: this app ships a Chromium and a Node to every user's machine, so a known
      # RCE in something it bundles is a shipped RCE. Dev-only advisories are excluded on
      # purpose — a build-tool advisory blocking a release teaches people to pass --force, and
      # then the gate protects nothing.
      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: DB-layer tests (Electron-as-Node)
        run: npm run test:db

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run bundle:budget

      - name: Hermetic IPC smoke test against the build
        run: npm run smoke
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}/total-data
          SMOKE_OUT: ${{ runner.temp }}/smoke

      # The full UI suite. Neither platform ran it before: the release gate was a smoke test that
      # proves the app boots and answers IPC, which is a long way from proving the screens work.
      # A flake fails this — see scripts/run-e2e.mjs, which retries once and reports FLAKE
      # separately, because a test that passes half the time is how a real bug ships green.
      - name: UI end-to-end suite
        run: npm run e2e -- --budget=1200

      - name: Upload E2E artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-macos
          path: smoke-out/e2e
          retention-days: 7

      - name: Ensure the release exists (one per tag)
        # electron-builder's parallel asset uploads race to CREATE the release and can end up
        # with two releases on one tag (observed on v0.3.0) — pre-creating makes it only upload.
        run: gh release create "$GITHUB_REF_NAME" --title "Total ${GITHUB_REF_NAME#v}" --notes "Release notes to follow." --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signing is driven entirely by whether the secrets exist, so this needs no code change on
      # the day the certificate arrives: add the secrets and the next tag is signed.
      #
      # macOS (Apple Developer ID, ~2 days to obtain):
      #   CSC_LINK                       base64 of the .p12
      #   CSC_KEY_PASSWORD               its password
      #   APPLE_ID                       the developer account email
      #   APPLE_APP_SPECIFIC_PASSWORD    app-specific password for notarytool
      #   APPLE_TEAM_ID                  10-character team id
      #
      # Until then builds stay unsigned: macOS says the app "cannot be checked for malicious
      # software", the user right-clicks -> Open once, and the in-app updater falls back to the
      # site's download prompt instead of updating silently.
      - name: Publish DMG + ZIP to the release
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without a certificate, stop electron-builder hunting for one and failing the build.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}

      - name: Report signing status
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "::notice::macOS build signed and submitted for notarization."
          else
            echo "::warning::macOS build is UNSIGNED. Gatekeeper warns on first launch and silent auto-update stays disabled. Add CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to enable signing."
          fi

  release-win:
    # Runs after the mac job so both publish into the SAME release —
    # parallel jobs each create their own release for the tag (learned the hard way).
    needs: release-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: DB-layer tests (Electron-as-Node)
        run: npm run test:db

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: Build NSIS installer (no publish — electron-builder creates a DUPLICATE
          release for the tag even when one exists; observed on v0.2.0)
        # Windows signing (OV or Azure Trusted Signing certificate, 1-3 weeks to obtain):
        #   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
        # Unsigned NSIS installers get a full-screen SmartScreen block on first run.
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Gate the Windows artefact on the app actually starting and answering IPC there, the way
      # the macOS job does. Publishing a Windows build nobody has launched is how a broken
      # release reaches the majority of the target market.
      - name: Hermetic IPC smoke test against the build
        run: npm run smoke

      # The full UI suite on Windows. Most of this market runs Windows, and the places a
      # macOS-only suite is blind are exactly the places that break there: path separators,
      # the native menu, `_electron` launch, and every file dialog.
      #
      # Given a generous budget: a cold Windows runner is slower than a Mac at booting Electron
      # 30 times, and a budget that fails on runner variance teaches people to ignore it.
      - name: UI end-to-end suite
        run: npm run e2e -- --budget=1800

      # Screenshots and results from a failed Windows run, which is otherwise the hardest
      # failure to diagnose from a Mac.
      - name: Upload E2E artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows
          path: smoke-out/e2e
          retention-days: 7

      - name: Report signing status
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            echo "::notice::Windows installer signed."
          else
            echo "::warning::Windows installer is UNSIGNED. SmartScreen will block it on first run. Add WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD to enable signing."
          fi

      - name: Upload installer to the existing release
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

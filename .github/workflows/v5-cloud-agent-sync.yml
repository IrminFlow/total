name: v5 cloud-agent-sync branch packages

on:
  push:
    branches: [v5-cloud-agent-sync]
  workflow_dispatch:
    inputs:
      channel:
        description: Artifact update channel (never published by this workflow)
        required: true
        default: internal
        type: choice
        options: [internal, beta, stable]
      rollout_percentage:
        description: Rollout percentage recorded in the test manifest
        required: true
        default: '100'
        type: choice
        options: ['0', '10', '25', '50', '100']

concurrency:
  group: v5-cloud-agent-sync-${{ github.ref }}
  cancel-in-progress: true

# Deliberately read-only: this workflow cannot create tags, releases or publish packages.
permissions:
  contents: read

env:
  STAGED_CHANNEL: ${{ inputs.channel || 'internal' }}
  STAGED_ROLLOUT: ${{ inputs.rollout_percentage || '100' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Typecheck and test application
        run: npm run typecheck && npm test && npm run test:release
      - name: Test database layer
        run: npm run test:db
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and test website
        working-directory: site
        run: npm ci && npm test && npm run build

  package:
    env:
      # This profile is compiled into the main process and copied into app.asar. The package
      # contract below rejects any production origin or enabled updater in these test artifacts.
      TOTAL_DESKTOP_BUILD_PROFILE: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            command: npx electron-builder --mac --arm64 --publish never --config.forceCodeSigning=false --config.mac.notarize=false
          - os: windows-latest
            platform: win
            command: npx electron-builder --win --publish never --config.forceCodeSigning=false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Build unsigned, non-publishing package
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify package contract
        run: npm run release:package-contract -- ${{ matrix.platform }}
        env:
          PACKAGE_CONTRACT_EVIDENCE: dist/package-contract-${{ matrix.platform }}.json
      - name: Create content-addressed staged manifest
        shell: bash
        run: >-
          node scripts/staged-release-manifest.mjs
          --artifacts dist
          --output dist/staged-release-manifest-${{ matrix.platform }}.json
          --channel "$STAGED_CHANNEL"
          --rollout "$STAGED_ROLLOUT"
          --revision "${{ github.sha }}"
          --platform "${{ matrix.platform }}"
      - name: Publish branch-only unsigned test download
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.V5_TEST_BLOB_READ_WRITE_TOKEN }}
        run: |
          if test -z "$BLOB_READ_WRITE_TOKEN"; then
            echo "Branch test-download storage is not configured; skipping public test upload."
            exit 0
          fi

          case "${{ matrix.platform }}" in
            mac) extension='dmg' ;;
            win) extension='exe' ;;
            *) echo "Unsupported package platform" >&2; exit 1 ;;
          esac

          installer_count="$(find dist -maxdepth 1 -type f -name "*.${extension}" -print | wc -l | tr -d ' ')"
          test "$installer_count" -eq 1 || {
            echo "Expected exactly one .${extension} installer, found $installer_count." >&2
            exit 1
          }

          npm ci --prefix site --ignore-scripts
          installer="$(find dist -maxdepth 1 -type f -name "*.${extension}" -print)"
          pathname="v5/${{ github.sha }}/$(basename "$installer")"
          TOTAL_TEST_INSTALLER="$installer" TOTAL_TEST_PATHNAME="$pathname" \
            node --input-type=module <<'NODE' > "dist/test-download-${{ matrix.platform }}.json"
          import { createReadStream } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { stat } from 'node:fs/promises'
          import { put } from './site/node_modules/@vercel/blob/dist/index.js'

          const file = process.env.TOTAL_TEST_INSTALLER
          const pathname = process.env.TOTAL_TEST_PATHNAME
          if (!file || !pathname) throw new Error('Test installer identity is missing')

          const digest = createHash('sha256')
          for await (const chunk of createReadStream(file)) digest.update(chunk)
          const metadata = await stat(file)
          const uploaded = await put(pathname, createReadStream(file), {
            access: 'public',
            addRandomSuffix: false,
            allowOverwrite: true,
            cacheControlMaxAge: 3600,
            multipart: true,
          })

          process.stdout.write(JSON.stringify({
            schema: 1,
            channel: 'v5-unsigned-test',
            sourceRevision: process.env.GITHUB_SHA,
            platform: '${{ matrix.platform }}',
            filename: file.split(/[\\/]/).at(-1),
            bytes: metadata.size,
            sha256: digest.digest('hex'),
            url: uploaded.url,
            signed: false,
            publishableRelease: false,
          }, null, 2))
          NODE

          node -e '
            const row = require(`./dist/test-download-${{ matrix.platform }}.json`)
            console.log(`### ${{ matrix.platform }} unsigned v5 test download`)
            console.log(`- URL: ${row.url}`)
            console.log(`- SHA-256: ${row.sha256}`)
            console.log(`- Source: ${row.sourceRevision}`)
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test packages and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v5-cloud-agent-sync-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/package-contract-${{ matrix.platform }}.json
            dist/staged-release-manifest-${{ matrix.platform }}.json
            dist/test-download-${{ matrix.platform }}.json

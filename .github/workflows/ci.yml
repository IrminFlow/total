# Runs on every push/PR to main: pure-TS + DB-layer tests on Linux, a hermetic Electron IPC
# smoke test on macOS, and the Windows job (WP 7.3: every test suite, the smoke against out/ and
# against the packaged exe, an e2e subset, the NSIS build). Separate from release.yml (tag-triggered
# publish pipeline) — this workflow never publishes anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (pure engine, no DB)
        run: npm test

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: DB-layer tests (Electron-as-Node — headless-safe, no display needed)
        run: npm run test:db

  # WP 7.1 performance budgets (docs/perf-budgets.md): a 100k-voucher Perf Traders company is
  # seeded through the services once per generator / save-path version (cached by the hash of
  # the files that decide what it stores), then every budgeted operation is timed and the job
  # fails when one is over 150 % of its budget × TOTAL_PERF_SCALE (this runner vs the laptop the
  # budgets were measured on). The 500k run is manual: npm run perf -- --vouchers 500000.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the 100k seed
        id: seed-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/perf100k
          key: perf-seed-100k-v1-${{ hashFiles('src/main/perf/seedLarge.ts', 'src/main/db/seed.ts', 'src/main/services/vouchers.ts', 'src/main/services/masters.ts', 'src/main/services/openingBills.ts', 'src/main/services/tradeLinks.ts', 'src/main/services/banking.ts', 'src/main/db/migrations.ts') }}

      - name: Seed 100k vouchers (cache miss only)
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: node scripts/total-cli.mjs perf-seed --vouchers 100000 --out "$RUNNER_TEMP/perf100k"

      - name: Performance budgets (100k)
        run: npm run test:db -- src/main/perf/budgets.dbtest.ts
        env:
          TOTAL_PERF: '1'
          TOTAL_PERF_DATA: ${{ runner.temp }}/perf100k
          TOTAL_PERF_SCALE: '1.6'

  smoke-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # WP 5.7: the MCP SDK must stay out of the app's main bundle and the HTTP stack out of the
      # CLI bundle. `npm test` runs before any build (the bundle checks skip there); here the
      # built outputs exist and TOTAL_REQUIRE_BUILT makes a missing one fail.
      - name: MCP packaging boundary (built bundles)
        run: |
          TOTAL_DATA_DIR="$RUNNER_TEMP/cli-data" node scripts/total-cli.mjs help > /dev/null
          TOTAL_REQUIRE_BUILT=1 npx vitest run src/main/mcp/mcpBoundary.test.ts

      - name: Hermetic IPC smoke test
        run: npm run smoke
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}/total-data
          SMOKE_OUT: ${{ runner.temp }}/smoke

      - name: Upload smoke screenshots
        # Diagnostics only: kept for failures, short-lived, and never allowed to fail the job
        # (a full artifact storage quota once turned a passing smoke run red).
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: ${{ runner.temp }}/smoke
          retention-days: 7

  # Full UI E2E suite (scripts/e2e/*.mjs via npm run e2e) against the built app. Push-to-main
  # only — it's the slowest job, and PRs already get the smoke-mac coverage above.
  e2e-mac:
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: E2E scenarios
        run: npm run e2e
        env:
          SMOKE_OUT: ${{ runner.temp }}/e2e
          # WP 7.4: the app's "today" is the LOCAL date; scenarios compute theirs the same way
          # (scripts/lib/harness.mjs localToday) — pin the zone so CI and a local run in India agree.
          TZ: Asia/Kolkata

      - name: Upload E2E screenshots + results
        # Diagnostics only: kept for failures, short-lived, and never allowed to fail the job
        # (a full artifact storage quota once turned a passing smoke run red).
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  # WP 7.3 Windows parity: the same gates as Linux + macOS (typecheck, unit, renderer, DB), then the
  # built app is driven for real — the hermetic IPC smoke against out/, a small e2e subset, an NSIS
  # build whose latest.yml must name the installer exactly, and the smoke again against the
  # PACKAGED exe (asar, extraResources fonts, DPAPI secret store). docs/windows.md has the matrix.
  build-win:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      # Hosted runners scan every new file (node_modules, scratch company DBs, the -wal/-shm SQLite
      # writes) in real time; the stalls are what pushed DB-test hooks past 10 s now and then.
      - name: Keep Defender's real-time scan off the workspace and temp folders
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP -ErrorAction SilentlyContinue
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (pure engine, no DB)
        run: npm test

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: DB-layer tests (Electron-as-Node)
        run: npm run test:db

      - name: Build
        run: npm run build

      # The headless CLI on Windows: esbuild bundle + Electron-as-Node + a data dir with a space.
      - name: CLI (total-cli) runs
        shell: bash
        run: |
          node scripts/total-cli.mjs help > /dev/null
          node scripts/total-cli.mjs create-company --name "CLI Win Co" --state 27 | tee "$RUNNER_TEMP/cli.json"
          node scripts/total-cli.mjs companies | grep -q cli-win-co
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}\cli data

      - name: Hermetic IPC smoke test (out/)
        run: npm run smoke
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}\Total smoke data
          SMOKE_OUT: ${{ runner.temp }}\smoke

      - name: E2E subset (onboarding, voucher lifecycle, unregistered sale, setup presets)
        run: node scripts/run-e2e.mjs 01 03 46 48
        env:
          SMOKE_OUT: ${{ runner.temp }}\e2e

      - name: NSIS installer + unpacked app (no publish)
        run: npx electron-builder --win --publish never

      # electron-updater downloads the file latest.yml names; the release must carry exactly that
      # asset (a space in the name is renamed by GitHub on upload — the 0.11.0 mismatch).
      - name: latest.yml names the installer exactly
        shell: bash
        run: |
          exe=$(cd dist && ls *.exe | head -1)
          echo "installer: $exe"
          case "$exe" in *" "*) echo "installer name has a space"; exit 1;; esac
          grep -q "^path: $exe$" dist/latest.yml || { echo "latest.yml does not name $exe"; cat dist/latest.yml; exit 1; }

      - name: Hermetic IPC smoke test (packaged Total.exe)
        run: npm run smoke
        env:
          TOTAL_APP_EXECUTABLE: ${{ github.workspace }}\dist\win-unpacked\Total.exe
          TOTAL_DATA_DIR: ${{ runner.temp }}\Total packaged data
          SMOKE_OUT: ${{ runner.temp }}\smoke-packaged

      - name: Upload smoke / e2e screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: win-shots
          path: |
            ${{ runner.temp }}\smoke
            ${{ runner.temp }}\smoke-packaged
            ${{ runner.temp }}\e2e
          retention-days: 7

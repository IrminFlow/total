# Runs on every push/PR to main: pure-TS + DB-layer tests on Linux, a hermetic Electron IPC
# smoke test on macOS, and a Windows build sanity check. Separate from release.yml (tag-triggered
# publish pipeline) — this workflow never publishes anything.
name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Website route and security contracts
        run: npm test

      - name: Build marketing and support site
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (pure engine, no DB)
        run: npm test

      - name: Dependency and license policy
        run: npm run security:dependencies

      - name: Production readiness contract
        run: npm run release:readiness

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: DB-layer tests (Electron-as-Node — headless-safe, no display needed)
        run: npm run test:db

  smoke-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Renderer bundle budget
        run: npm run perf:bundle

      - name: Hermetic IPC smoke test
        run: npm run smoke
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}/total-data
          SMOKE_OUT: ${{ runner.temp }}/smoke

      - name: Large-workflow memory budget
        run: npm run perf:memory
        env:
          SMOKE_OUT: ${{ runner.temp }}/performance

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-shots
          path: ${{ runner.temp }}/smoke

  # Split the full desktop suite across four macOS runners so PRs receive the same workflow
  # coverage as main without serializing all scenarios on one machine.
  e2e-mac:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: E2E scenarios (shard ${{ matrix.shard }})
        shell: bash
        run: |
          mapfile -t scenarios < <(find scripts/e2e -maxdepth 1 -name '[0-9][0-9]-*.mjs' -print \
            | sort \
            | awk -F/ -v shard='${{ matrix.shard }}' 'substr($NF,1,2) % 4 == shard { sub(/\.mjs$/, "", $NF); print $NF }')
          test "${#scenarios[@]}" -gt 0
          node scripts/run-e2e.mjs "${scenarios[@]}"
        env:
          SMOKE_OUT: ${{ runner.temp }}/e2e

      - name: Upload E2E screenshots + results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e

  visual-contracts:
    needs: e2e-mac
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-shots-*
          path: smoke-out/e2e
          merge-multiple: true

      - name: Verify visual evidence contracts
        run: node scripts/visual-regression-gate.mjs --inspect-only

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Electron-builder dir build (no publish)
        run: npx electron-builder --win --dir --publish never

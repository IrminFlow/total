# Runs on every push/PR to main: pure-TS + DB-layer tests on Linux, a hermetic Electron IPC
# smoke test on macOS, and a Windows build sanity check. Separate from release.yml (tag-triggered
# publish pipeline) — this workflow never publishes anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (pure engine, no DB)
        run: npm test

      - name: Renderer tests (jsdom + RTL), with the coverage floor
        run: npm run test:renderer:coverage

      - name: DB-layer tests (Electron-as-Node — headless-safe, no display needed)
        run: npm run test:db
        env:
          # A shared CI runner is a contended machine, and the query-time budgets are wall-clock
          # ceilings. They already take the best of five runs, which handles a blip; it does not
          # handle a runner that is oversubscribed for the whole job. Scaled up here rather than
          # loosened in the file, so a developer's own run keeps the tight number that would
          # actually notice a regression.
          TOTAL_QUERY_BUDGET_SCALE: 3

      # A report on the run's summary page, never a gate. A build that fails because something
      # published a minor version this morning teaches people to skip the check — and the check
      # that matters, a known vulnerability in something shipped to users, is already a gate in
      # release.yml. `if: always()` so it still prints when a test above it failed, since "what
      # changed under us" is exactly the question a red build raises.
      - name: Dependency freshness
        if: always()
        run: node scripts/deps-report.mjs

  smoke-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Hermetic IPC smoke test
        run: npm run smoke
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}/total-data
          SMOKE_OUT: ${{ runner.temp }}/smoke

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: ${{ runner.temp }}/smoke

  # Full UI E2E suite (scripts/e2e/*.mjs via npm run e2e) against the built app. Push-to-main
  # only — it's the slowest job, and PRs already get the smoke-mac coverage above.
  e2e-mac:
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: E2E scenarios
        run: npm run e2e
        env:
          SMOKE_OUT: ${{ runner.temp }}/e2e

      - name: Upload E2E screenshots + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: ${{ runner.temp }}/e2e

  # Windows used to build and stop there, which meant the platform most of the target market
  # runs on had its UI, native dialogs, PDF printing and path handling verified by nothing.
  # It now runs the same smoke test as macOS on every push/PR, and the full E2E suite on
  # push-to-main.
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: DB-layer tests (Electron-as-Node)
        run: npm run test:db
        env:
          TOTAL_QUERY_BUDGET_SCALE: 3

      - name: Build
        run: npm run build

      - name: Hermetic IPC smoke test
        run: npm run smoke
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}\total-data
          SMOKE_OUT: ${{ runner.temp }}\smoke

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots-win
          path: ${{ runner.temp }}\smoke

      - name: Electron-builder dir build (no publish)
        run: npx electron-builder --win --dir --publish never

  # Same rationale as e2e-mac: slowest job, push-to-main only.
  e2e-win:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: E2E scenarios
        run: npm run e2e
        env:
          SMOKE_OUT: ${{ runner.temp }}\e2e

      - name: Upload E2E screenshots + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-win
          path: ${{ runner.temp }}\e2e
